<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FreshCart Grocery Store</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>

        <div class="logo">
            FreshCart
        </div>

        <nav>
            <a href="#">Home</a>
            <a href="#products">Products</a>
            <a href="#about">About</a>
        </nav>

        <div class="cart">
            🛒 Cart: <span id="cart-count">0</span>
        </div>

    </header>


    <section class="hero">

        <h1>
            Fresh groceries, simple shopping.
        </h1>

        <p>
            Shop fresh groceries at affordable prices.
        </p>

        <a href="#products" class="shop-button">
            Shop Now
        </a>

    </section>


    <section id="products" class="products-section">

        <h2>Our Products</h2>

        <div id="products-container">
            Loading products...
        </div>

    </section>


    <section id="about" class="about">

        <h2>About FreshCart</h2>

        <p>
            A simple grocery store website built
            using HTML, CSS, JavaScript and Flask.
        </p>

    </section>


    <footer>

        <p>
            © 2026 FreshCart
        </p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
