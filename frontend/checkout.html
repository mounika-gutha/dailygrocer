<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>FreshCart - Checkout</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<header>

    <div class="logo">
        FreshCart
    </div>

    <div class="checkout-title">
        Secure Checkout
    </div>

</header>


<main class="checkout-container">


    <!-- LEFT SIDE -->

    <div>


        <!-- DELIVERY ADDRESS -->

        <section class="address-section">

            <h2>
                📍 Delivery Address
            </h2>

            <p class="section-description">
                Where should we deliver your groceries?
            </p>


            <form id="address-form">


                <div class="form-group">

                    <label>
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Mobile Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="10-digit mobile number"
                        required
                    >

                </div>


                <div class="form-row">

                    <div class="form-group">

                        <label>
                            House / Flat No.
                        </label>

                        <input
                            type="text"
                            id="house"
                            placeholder="Flat / House number"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Building / Apartment
                        </label>

                        <input
                            type="text"
                            id="building"
                            placeholder="Building name"
                        >

                    </div>

                </div>


                <div class="form-group">

                    <label>
                        Area / Locality
                    </label>

                    <input
                        type="text"
                        id="area"
                        placeholder="Enter area or locality"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Street / Road
                    </label>

                    <input
                        type="text"
                        id="street"
                        placeholder="Street or road name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Landmark
                    </label>

                    <input
                        type="text"
                        id="landmark"
                        placeholder="Nearby landmark (optional)"
                    >

                </div>


                <div class="form-row">

                    <div class="form-group">

                        <label>
                            City
                        </label>

                        <input
                            type="text"
                            id="city"
                            placeholder="City"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            State
                        </label>

                        <input
                            type="text"
                            id="state"
                            placeholder="State"
                            required
                        >

                    </div>

                </div>


                <div class="form-group">

                    <label>
                        PIN Code
                    </label>

                    <input
                        type="text"
                        id="pincode"
                        placeholder="6-digit PIN code"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Address Type
                    </label>


                    <div class="address-type">

                        <label>

                            <input
                                type="radio"
                                name="address-type"
                                value="Home"
                                checked
                            >

                            🏠 Home

                        </label>


                        <label>

                            <input
                                type="radio"
                                name="address-type"
                                value="Work"
                            >

                            🏢 Work

                        </label>

                    </div>

                </div>


                <button
                    type="submit"
                    class="save-address-button"
                >
                    Save Delivery Address
                </button>


            </form>

        </section>


        <!-- PAYMENT -->

        <section class="payment-section">

            <h2>
                💳 Payment Method
            </h2>

            <div class="payment-option">

                <label>

                    <input
                        type="radio"
                        name="payment"
                        value="cod"
                        checked
                    >

                    <span>
                        💵 Cash on Delivery
                    </span>

                </label>

            </div>


            <div class="payment-option">

                <label>

                    <input
                        type="radio"
                        name="payment"
                        value="upi"
                    >

                    <span>
                        📱 UPI
                    </span>

                </label>

            </div>


            <div class="payment-option">

                <label>

                    <input
                        type="radio"
                        name="payment"
                        value="card"
                    >

                    <span>
                        💳 Card
                    </span>

                </label>

            </div>

        </section>

    </div>


    <!-- RIGHT SIDE -->

    <aside class="order-summary">

        <h2>
            🛒 Order Summary
        </h2>


        <div id="checkout-items">

            Loading cart...

        </div>


        <div id="checkout-total">

        </div>


        <div class="delivery-info">

            🚚 Free delivery on your order

        </div>


        <button
            class="place-order-button"
            onclick="placeOrder()"
        >

            Place Order

        </button>

    </aside>


</main>


<footer>

    <p>
        © 2026 FreshCart · Fresh groceries delivered to your door
    </p>

</footer>


<script src="checkout.js"></script>

</body>

</html>
